[build]
  command   = "bun install && bunx vite build"
  publish   = "dist"
  ignore    = ""

[build.processing]
  skip_processing = false

[context.production]
  environment = { GIT_SUBMODULE_STRATEGY = "none" }

[build.environment]
  NODE_VERSION = "20"
  # Must match .bun-version; Netlify resolves both and they were disagreeing.
  BUN_VERSION  = "1.3.14"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
