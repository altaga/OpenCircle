<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#85B1ED"/>
      <stop offset="40%"  stop-color="#AF8FF4"/>
      <stop offset="70%"  stop-color="#FFCD83"/>
      <stop offset="100%" stop-color="#F47070"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background (safe zone for maskable) -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="#122d45"/>
  <!-- Spectral ring -->
  <rect x="40" y="40" width="432" height="432" rx="82" fill="none" stroke="url(#ring)" stroke-width="18"/>
  <!-- OpenCircle mark: outer ring -->
  <circle cx="256" cy="256" r="96" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
  <!-- Crosshair horizontal -->
  <line x1="196" y1="256" x2="316" y2="256" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
  <!-- Crosshair vertical -->
  <line x1="256" y1="196" x2="256" y2="316" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
</svg>
