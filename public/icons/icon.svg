<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="g" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#85B1ED"/>
      <stop offset="50%"  stop-color="#AF8FF4"/>
      <stop offset="100%" stop-color="#FFCD83"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#122d45"/>
  <!-- Open-C arc: center(50,50) r=28, start 315°, end 45°, 270° CW -->
  <!-- 315° → (69.80, 30.20)   45° → (69.80, 69.80) -->
  <path d="M 69.80 30.20 A 28 28 0 1 0 69.80 69.80"
        stroke="url(#g)" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- Central coin dot -->
  <circle cx="50" cy="50" r="6.5" fill="url(#g)"/>
</svg>
